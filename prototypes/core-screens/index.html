<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: neutral lab bench; the phone is the subject, notes and live state beside it (below it on phones). */
:root {
  --bg: #ECEEF3; --fg: #15171C; --muted: #5E6370; --line: #D6DAE2; --card: #FFFFFF;
  --sw-bg: #15171C; --sw-fg: #F3F4F6; --frame: #0A0A0B;
  --chrome-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Look A tokens (Design system, #12) */
  --p-main: #1E50E6; --p-on-main: #FFFFFF; --p-main-ink: #1A46CC; --p-main-soft: #E4EBFD;
  --p-bg: #F2F3F8; --p-surface: #FFFFFF; --p-text: #0E1220; --p-muted: #636A7E; --p-line: #E1E4ED;
  --p-green: #0E9F64; --p-red: #E5484D; --p-amber: #B7791F; --p-amber-soft: #FCF1DC;
  --p-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1013; --fg: #E8EAEE; --muted: #9AA0AC; --line: #2A2E36; --card: #171A1F; --sw-bg: #F3F4F6; --sw-fg: #15171C; --frame: #2A2D33;
    --p-main: #3B68F5; --p-on-main: #FFFFFF; --p-main-ink: #8AA6FF; --p-main-soft: #182650;
    --p-bg: #0A0C12; --p-surface: #151924; --p-text: #F1F3F9; --p-muted: #9298AB; --p-line: #252A39;
    --p-green: #3DD68C; --p-red: #FF6369; --p-amber: #F0B44C; --p-amber-soft: #3A2C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1013; --fg: #E8EAEE; --muted: #9AA0AC; --line: #2A2E36; --card: #171A1F; --sw-bg: #F3F4F6; --sw-fg: #15171C; --frame: #2A2D33;
  --p-main: #3B68F5; --p-on-main: #FFFFFF; --p-main-ink: #8AA6FF; --p-main-soft: #182650;
  --p-bg: #0A0C12; --p-surface: #151924; --p-text: #F1F3F9; --p-muted: #9298AB; --p-line: #252A39;
  --p-green: #3DD68C; --p-red: #FF6369; --p-amber: #F0B44C; --p-amber-soft: #3A2C12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--chrome-font); margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--p-main); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 110px; display: grid; gap: 28px; grid-template-columns: 1fr; justify-items: center; }
@media (min-width: 900px) { .wrap { grid-template-columns: 410px minmax(0, 1fr); align-items: start; justify-items: stretch; } }

/* ---------- notes panel (prototype chrome) ---------- */
.notes { display: flex; flex-direction: column; gap: 18px; min-width: 0; width: 100%; max-width: 640px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notes h1 { margin: 4px 0 0; font-size: 24px; text-wrap: balance; }
.notes p { margin: 0; line-height: 1.5; font-size: 14px; color: var(--muted); max-width: 64ch; }
.notes .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.notes dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 13.5px; line-height: 1.45; }
.notes dt { color: var(--muted); font-family: var(--mono); font-size: 11.5px; padding-top: 2px; }
.notes dd { margin: 0; min-width: 0; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; background: var(--card); }
.jump button:hover { border-color: var(--fg); }
.jump button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.state { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.state div { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.state b { color: var(--fg); font-size: 16px; font-variant-numeric: tabular-nums; }
.last { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

/* ---------- floating variant switcher (prototype chrome) ---------- */
.sw { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 4px; background: var(--sw-bg); color: var(--sw-fg); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-family: var(--mono); font-size: 13px; }
.sw button { width: 36px; height: 36px; border-radius: 50%; font-size: 18px; text-align: center; }
.sw button:hover { background: color-mix(in srgb, var(--sw-fg) 15%, transparent); }
.sw .lbl { padding: 0 6px; white-space: nowrap; min-width: 128px; text-align: center; }
.sw .grp { display: flex; align-items: center; }
.sw .grp + .grp { border-left: 1px solid color-mix(in srgb, var(--sw-fg) 25%, transparent); padding-left: 4px; }
@media (max-width: 600px) { .sw { flex-direction: column; border-radius: 22px; gap: 0; } .sw .grp + .grp { border-left: 0; padding-left: 0; } }

/* ---------- phone ---------- */
.ph { position: relative; width: min(390px, 100%); height: 800px; max-height: calc(100dvh - 120px); min-height: 600px; border-radius: 44px; overflow: hidden; border: 10px solid var(--frame); box-shadow: 0 20px 50px rgba(0,0,0,.18); background: var(--p-bg); color: var(--p-text); font-family: var(--p-font); font-size: 15px; display: flex; flex-direction: column; }
@media (max-width: 440px) { .ph { border-width: 6px; border-radius: 34px; } }
.ph svg { display: block; flex: none; }
.num, .amt, .big { font-variant-numeric: tabular-nums; }
.scr { flex: 1; overflow-y: auto; min-height: 0; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 22px; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.scr > *, .sheet .in > * { flex-shrink: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
.box-btn { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; background: var(--p-surface); display: grid; place-items: center; color: var(--p-text); flex: none; }
.back { display: flex; align-items: center; gap: 2px; color: var(--p-main-ink); font-size: 16px; font-weight: 500; margin-left: -6px; }
.title { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.top .title { font-size: 28px; }

.hero { background: var(--p-main); color: var(--p-on-main); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.hero .lab { font-size: 14px; opacity: .85; }
.hero .big { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.hero .sub { font-size: 13px; opacity: .85; }
.hero .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill { border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.pill.white { background: #fff; color: #1A2A8F; }
.pill.ghost { background: rgba(255,255,255,.18); color: #fff; }
.pill.main { background: var(--p-main); color: var(--p-on-main); }
.pill.soft { background: var(--p-main-soft); color: var(--p-main-ink); }
.pill.plain { background: var(--p-surface); color: var(--p-text); }
.pill.danger { background: var(--p-surface); color: var(--p-red); }
.pill[disabled] { opacity: .4; cursor: default; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--p-surface); border-radius: 14px; padding: 12px 4px; }
.stats > * { display: flex; flex-direction: column; gap: 2px; align-items: center; font-size: 12px; color: var(--p-muted); text-align: center; }
.stats b { color: var(--p-text); font-size: 15px; font-weight: 600; }
.stats.four { grid-template-columns: repeat(2, 1fr); row-gap: 14px; }

.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h3 { margin: 0; font-size: 20px; font-weight: 600; }
.sec-h .link, .link { color: var(--p-main-ink); font-size: 15px; font-weight: 500; }
.cap { font-size: 13px; color: var(--p-muted); font-weight: 500; padding: 0 4px; }
.group { background: var(--p-surface); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; min-height: 52px; }
.row + .row { border-top: 1px solid var(--p-line); }
.row .t { flex: 1; min-width: 0; }
.row .t > div { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t > div b { font-weight: 600; }
.row .t small { display: block; font-size: 13px; color: var(--p-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-size: 15px; font-weight: 600; white-space: nowrap; }
.row .amt.pos { color: var(--p-green); }
.row .amt.strike { text-decoration: line-through; color: var(--p-muted); font-weight: 500; }
.row .chev { color: var(--p-muted); }
.row.me { background: color-mix(in srgb, var(--p-main-soft) 55%, var(--p-surface)); }
.row.sel { background: color-mix(in srgb, var(--p-main-soft) 70%, var(--p-surface)); }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--p-main-soft); color: var(--p-main-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.av.lg { width: 52px; height: 52px; font-size: 18px; }
.av.xl { width: 76px; height: 76px; font-size: 26px; }
.av.ghost { background: transparent; border: 1.5px dashed var(--p-muted); color: var(--p-muted); }
.av.icon { background: var(--p-bg); color: var(--p-muted); }
.av.green { background: color-mix(in srgb, var(--p-green) 16%, transparent); color: var(--p-green); }
.emo { width: 38px; height: 38px; border-radius: 12px; background: var(--p-bg); display: grid; place-items: center; font-size: 20px; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--p-main-soft); color: var(--p-main-ink); white-space: nowrap; vertical-align: 1px; }
.tag.amber { background: var(--p-amber-soft); color: var(--p-amber); }
.tag.grey { background: var(--p-bg); color: var(--p-muted); }
.tag.green { background: color-mix(in srgb, var(--p-green) 16%, transparent); color: var(--p-green); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--p-line); display: grid; place-items: center; flex: none; color: transparent; }
.check.on { background: var(--p-main); border-color: var(--p-main); color: var(--p-on-main); }
.check.sq { border-radius: 7px; }

.field { display: flex; align-items: center; gap: 8px; background: var(--p-surface); border-radius: 12px; padding: 0 12px; height: 44px; color: var(--p-muted); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--p-text); height: 100%; }
.field.lg { height: 52px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in srgb, var(--p-line) 70%, transparent); border-radius: 10px; padding: 2px; }
.seg button { padding: 7px 8px; border-radius: 8px; font-size: 13.5px; font-weight: 500; text-align: center; color: var(--p-text); }
.seg button.on { background: var(--p-surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--p-surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--p-main); color: var(--p-on-main); }
.people { display: flex; gap: 14px; overflow-x: auto; padding: 6px 2px 2px 6px; scrollbar-width: none; }
.people::-webkit-scrollbar { display: none; }
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; position: relative; flex: none; width: 56px; text-align: center; }
.person.sel .av { box-shadow: 0 0 0 2.5px var(--p-bg), 0 0 0 4.5px var(--p-main); }
.person .pc { position: absolute; top: 34px; right: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; border: 2px solid var(--p-bg); }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; }
.pgrid .person { width: auto; }

.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 8px 6px 22px; background: var(--p-surface); border-top: 1px solid var(--p-line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--p-muted); }
.tabbar button.on { color: var(--p-main-ink); }
.fab { width: 56px; height: 56px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; margin: -26px auto 0; box-shadow: 0 6px 16px color-mix(in srgb, var(--p-main) 45%, transparent); }
.ctabar { flex: none; padding: 10px 16px 24px; background: linear-gradient(to bottom, transparent, var(--p-bg) 30%); }
.cta { width: 100%; background: var(--p-main); color: var(--p-on-main); border-radius: 999px; padding: 16px; text-align: center; font-size: 17px; font-weight: 600; box-shadow: 0 6px 16px color-mix(in srgb, var(--p-main) 35%, transparent); }
.cta[disabled] { opacity: .4; box-shadow: none; cursor: default; }
.cta.sec2 { background: var(--p-surface); color: var(--p-text); box-shadow: none; }

/* sheets */
.layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); }
.sheet { position: relative; max-height: 92%; background: var(--p-bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
.sheet.tall { height: 88%; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--p-line); margin: 8px auto 2px; flex: none; }
.sheet .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; gap: 8px; flex: none; }
.sheet .hd h3 { margin: 0; font-size: 20px; font-weight: 600; }
.sheet .in { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; scrollbar-width: none; }
.sheet .in::-webkit-scrollbar { display: none; }
.sheet .ft { flex: none; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet, .drawer { animation: none; } }
.note { font-size: 13px; color: var(--p-muted); line-height: 1.45; padding: 0 4px; }
.note.warn { color: var(--p-amber); }
.callout { background: var(--p-amber-soft); color: var(--p-text); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; width: 100%; }
.callout .ic { color: var(--p-amber); }
.toast { position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 30; background: var(--p-text); color: var(--p-bg); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: up .2s ease-out; }
.toast span { flex: 1; }
.toast button { font-weight: 700; color: color-mix(in srgb, var(--p-main) 60%, var(--p-bg)); }

/* auth */
.auth { flex: 1; display: flex; flex-direction: column; padding: 40px 22px 28px; gap: 22px; overflow-y: auto; }
.logo { width: 64px; height: 64px; border-radius: 18px; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; }
.auth h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.auth p { margin: 0; color: var(--p-muted); line-height: 1.45; }
.steps { display: flex; flex-direction: column; gap: 0; }
.steps .row { gap: 14px; }
.stepn { width: 28px; height: 28px; border-radius: 50%; background: var(--p-main-soft); color: var(--p-main-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.code { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.code div { height: 56px; border-radius: 12px; background: var(--p-surface); display: grid; place-items: center; font-size: 24px; font-weight: 600; border: 2px solid transparent; }
.code div.cur { border-color: var(--p-main); }
.code input { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
.spacer { flex: 1; }

/* tiles (kategori grid) */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--p-surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-height: 86px; position: relative; border: 2px solid transparent; }
.tile .e { font-size: 22px; line-height: 1; }
.tile .n { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.tile .p { font-size: 12px; color: var(--p-muted); margin-top: auto; font-variant-numeric: tabular-nums; }
.tile.on { border-color: var(--p-main); background: color-mix(in srgb, var(--p-main-soft) 60%, var(--p-surface)); }
.tile.dash { background: transparent; border: 2px dashed var(--p-line); color: var(--p-main-ink); }
.rank { font-size: 13px; color: var(--p-muted); width: 18px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.badge { position: absolute; top: -3px; right: 0; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--p-main); color: var(--p-on-main); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--p-bg); font-variant-numeric: tabular-nums; }
.tile .badge { top: 6px; right: 6px; border-color: var(--p-surface); }
.person.cur .av { background: var(--p-main); color: var(--p-on-main); box-shadow: 0 0 0 2.5px var(--p-bg), 0 0 0 4.5px var(--p-main); }
.person.cur span:last-child { font-weight: 700; color: var(--p-main-ink); }

/* home drafts */
.acts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bigact { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; border-radius: 16px; font-size: 16px; font-weight: 600; background: var(--p-surface); color: var(--p-text); }
.bigact.main { background: var(--p-main); color: var(--p-on-main); box-shadow: 0 6px 16px color-mix(in srgb, var(--p-main) 35%, transparent); }
.duo { display: grid; grid-template-columns: 1fr 1fr; background: var(--p-surface); border-radius: 14px; }
.duo > * { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--p-muted); }
.duo > * + * { border-left: 1px solid var(--p-line); }
.duo b { font-size: 22px; color: var(--p-text); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--p-line); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .paid { background: var(--p-green); }
.bar .owe { background: var(--p-main); }
.hero .bar { background: rgba(255,255,255,.25); height: 10px; border-radius: 5px; margin-top: 10px; }
.hero .bar .paid { background: #fff; }
.lb { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.lb .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 500; }
.lb .l2 { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--p-muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--p-muted); padding: 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

const lk = (p, k) => p + '|' + k;
const cnt = (p, k) => S.give.lines[lk(p, k)] || 0;
function bump(p, k, d) { const g = S.give, key = lk(p, k), n = Math.max(0, (g.lines[key] || 0) + d); if (n) g.lines[key] = n; else delete g.lines[key]; }
const personCount = (p) => Object.entries(S.give.lines).filter(([key]) => key.startsWith(p + '|')).reduce((a, [, c]) => a + c, 0) + S.give.extra.filter(x => x.person === p).length;
function startGive(pre, preKat) {
  S.give = { people: pre ? [pre] : [], cur: pre || null, lines: {}, extra: [], same: false, q: '', sort: 'navn', cols: preKat ? [preKat] : [], preKat: preKat || null, minus: false, receipt: false };
  if (pre && preKat) bump(pre, preKat, 1);
  S.sheets = [{ t: 'give' }];
}
function giveSum() {
  const g = S.give; let n = 0, total = 0;
  for (const [key, c] of Object.entries(g.lines)) { n += c; total += c * kat(key.split('|')[1]).price; }
  for (const x of g.extra) { n++; total += x.amount; }
  return { n, total, fee: g.extra.length * D.settings.engang };
}
function byPerson() {
  const g = S.give, out = {};
  for (const [key, c] of Object.entries(g.lines)) { const [p, k] = key.split('|'); (out[p] = out[p] || { kats: [], extra: [] }).kats.push([k, c]); }
  g.extra.forEach((x, i) => (out[x.person] = out[x.person] || { kats: [], extra: [] }).extra.push([x, i]));
  return membersOrdered().filter(m => out[m.id]).map(m => [m.id, out[m.id]]);
}

function give3() {

      <div class="sec"><div class="sec-h"><span class="cap">2. Tryk for hver bøde</span><div class="seg" style="width:150px">${[[false, 'Tilføj'], [true, 'Fjern']].map(([v, l]) => `<button class="${g.minus === v ? 'on' : ''}" data-a="g3minus" data-v="${v ? 1 : ''}">${l}</button>`).join('')}</div></div>${table}</div>
      <p class="note">Engangsbøder gives fra en persons profil i denne variant.</p></div>
    <div class="ft">${summary()}${giveCta()}</div>`;
}
function submitGive() {
  const g = S.give, ids = [];
  for (const [key, c] of Object.entries(g.lines)) {
    const [p, k] = key.split('|');
    for (let i = 0; i < c; i++) ids.push(add({ kind: 'bode', from: ME, to: p, kat: k, amount: kat(k).price }));
    kat(k).uses += c;
  }
  for (const x of g.extra) { ids.push(add({ kind: 'bode', from: ME, to: x.person, reason: x.reason, amount: x.amount })); ids.push(add({ kind: 'gebyr', to: ME, reason: `Engangsbøde til ${first(x.person)}`, amount: D.settings.engang })); }
  const { n, total } = giveSum();
  S.give = null; S.sheets = [];
  toast(`${n} ${n === 1 ? 'bøde' : 'bøder'} givet · ${kr(total)}`, ids);
}

    return hd('Registrér indbetaling') + `<div class="in"><div class="sec"><span class="cap">Hvem har betalt?</span><div class="group">${[...D.members].sort((a, b) => saldo(b.id) - saldo(a.id)).map(x => `<button class="row ${m === x.id ? 'sel' : ''}" data-a="pm" data-v="${x.id}">${av(x.id)}<span class="t"><div>${esc(x.name)}</div><small>Mangler ${kr(saldo(x.id))}</small></span><span class="check ${m === x.id ? 'on' : ''}">${ic('check', 14)}</span></button>`).join('')}</div></div>
      <div class="field lg"><input id="pamt" data-in="form.pamt" inputmode="numeric" placeholder="Beløb" value="${esc(f.pamt || '')}"><span>kr</span></div></div>
      <div class="ft"><button class="cta" data-a="paysave" ${m && +f.pamt > 0 ? '' : 'disabled'}>Registrér ${+f.pamt > 0 ? kr(+f.pamt) : ''}</button></div>`;
  },
  haev() {
    const f = S.form;
    return hd('Hæv penge') + `<div class="in"><p class="note">Til fx julefrokost. Beløbet trækkes fra kassen, ikke fra nogens saldo. I kassen nu: ${kr(totals().inbox)}.</p>
      <div class="field lg"><input id="hamt" data-in="form.hamt" inputmode="numeric" placeholder="Beløb" value="${esc(f.hamt || '')}"><span>kr</span></div>
      <div class="field lg"><input id="hnote" data-in="form.hnote" placeholder="Hvad skal pengene bruges til?" value="${esc(f.hnote || '')}"></div></div>
      <div class="ft"><button class="cta" data-a="haevsave" ${+f.hamt > 0 && (f.hnote || '').trim() ? '' : 'disabled'}>Hæv</button></div>`;
  },
  addmember() {
    const f = S.form;
    return hd('Tilføj Medlem') + `<div class="in"><p class="note">Medlemmet kan få bøder med det samme. Når de logger ind med e-mailen, overtager de pladsen.</p>
      <div class="field lg"><input id="mname" data-in="form.mname" placeholder="Navn" value="${esc(f.mname || '')}"></div>
      <div class="field lg">${ic('mail', 18)}<input id="mmail" data-in="form.mmail" type="email" placeholder="E-mail" value="${esc(f.mmail || '')}"></div></div>
      <div class="ft"><button class="cta" data-a="memsave" ${(f.mname || '').trim() && (f.mmail || '').includes('@') ? '' : 'disabled'}>Tilføj</button></div>`;
  },
  boxes() {
    return hd('Skift Bødekasse') + `<div class="in"><div class="group">${D.boxes.map(b => `<button class="row" data-a="pickbox" data-v="${b.id}"><span class="av">${b.name[0]}</span><span class="t"><div>${esc(b.name)}</div><small>${b.n} Medlemmer</small></span>${b.id === 'fc' ? `<span class="check on">${ic('check', 14)}</span>` : ''}</button>`).join('')}</div>
      <div class="group"><button class="row" data-a="toast" data-v="Opret Bødekasse afgøres i Bødekasse og membership"><span class="av icon">${ic('plus', 20)}</span><span class="t"><div class="link">Opret ny Bødekasse</div></span></button></div></div><div class="ft"></div>`;
  },
};
function engangTargets() { const g = S.give; if (!g) return []; return S.giveV === 1 && g.same && g.people.length > 1 ? g.people : g.cur ? [g.cur] : []; }

// ---------------- toast ----------------
let toastTimer;
function toast(msg, undo) {
  S.toast = { msg, undo }; S.last = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 5000);
}
const toastHtml = () => S.toast ? `<div class="toast"><span>${esc(S.toast.msg)}</span>${S.toast.undo ? '<button data-a="undo">Fortryd</button>' : ''}</div>` : '';

// ---------------- navigation ----------------
function push(o) { S.stack.push(o); }
function parseScreen(v) { const [s, id] = v.split(':'); return id ? { s, id } : { s }; }
function resetNav() { S.stack = [{ s: 'home' }]; S.sheets = []; S.give = null; }

// ---------------- actions ----------------
const needPerson = () => { toast('Vælg først en person'); };
const ACT = {
  role(v) { S.role = v; S.last = `Viewing as ${v === 'admin' ? 'Admin' : 'Medlem'}`; },
  reset() { seq = 0; D = seed(); resetNav(); S.last = 'Data reset'; },
  jump(v) { jump(v); },
  go(v) { S.auth = v; if (v === 'code') S.code = ''; },
  pickbox(v) { if (v === 'fam') toast('Prototypen har kun data for FC Ølhunde'); S.auth = 'in'; S.sheets = []; resetNav(); },
  tab(v) { S.stack = [{ s: v }]; S.sheets = []; },
  push(v) { if (v === 'konknew') S.form = {}; S.sheets = []; push(parseScreen(v)); },
  back() { S.stack.pop(); },
  sheet(v) { const [t, id] = v.split(':'); S.form = sheetForm(t, id); openSheet({ t, id }); },
  close() { const o = S.sheets.pop(); if (o && o.t === 'give') S.give = null; },
  closeall() { S.sheets = []; S.give = null; },
  give(v) { startGive(v || null); },
  givekat(v) { startGive(null, v); },
  lbsort(v) { S.lbSort = v; },
  // draft 1: per person
  g1p(v) {
    const g = S.give, i = g.people.indexOf(v);
    if (i < 0) { g.people.push(v); g.cur = v; if (g.preKat && !personCount(v)) bump(v, g.preKat, 1); }
    else if (g.cur !== v && !g.same) g.cur = v;
    else { g.people.splice(i, 1); Object.keys(g.lines).forEach(k => { if (k.startsWith(v + '|')) delete g.lines[k]; }); g.extra = g.extra.filter(x => x.person !== v); g.cur = g.people[g.people.length - 1] || null; }
    if (g.people.length < 2) g.same = false;
  },
  g1k(v) { const g = S.give; if (!g.cur) return needPerson(); (g.same ? g.people : [g.cur]).forEach(p => bump(p, v, 1)); },
  g1m(v) { const g = S.give; (g.same ? g.people : [g.cur]).forEach(p => bump(p, v, -1)); },
  gsame() { S.give.same = !S.give.same; },
  gsort(v) { S.give.sort = v; },
  // draft 2: till
  g2p(v) { const g = S.give; g.cur = g.cur === v ? null : v; if (g.cur && g.preKat && !personCount(v)) bump(v, g.preKat, 1); },
  g2k(v) { const g = S.give; if (!g.cur) return needPerson(); bump(g.cur, v, 1); },
  receipt() { S.give.receipt = !S.give.receipt; },
  rp(v) { const [p, k] = v.split('|'); bump(p, k, 1); },
  rm(v) { const [p, k] = v.split('|'); bump(p, k, -1); },
  // draft 3: grid
  g3col(v) { const g = S.give, i = g.cols.indexOf(v); if (i >= 0) { g.cols.splice(i, 1); Object.keys(g.lines).forEach(k => { if (k.endsWith('|' + v)) delete g.lines[k]; }); } else g.cols.push(v); },
  g3c(v) { const [p, k] = v.split('|'); bump(p, k, S.give.minus ? -1 : 1); },
  g3minus(v) { S.give.minus = !!v; },
  engang() { if (!engangTargets().length) return needPerson(); S.form = {}; openSheet({ t: 'engang' }); },
  engangsave() { const f = S.form; engangTargets().forEach(p => S.give.extra.push({ person: p, reason: f.ereason.trim(), amount: +f.eamount })); S.sheets.pop(); },
  xdel(v) { S.give.extra.splice(+v, 1); },
  gsubmit() { submitGive(); },
  undo() { const ids = S.toast.undo; D.ledger.forEach(e => { if (ids.includes(e.id)) e.undone = true; }); S.toast = null; S.last = `Undid ${ids.length} entries`; },
  katsort(v) { S.katSort = v; },
  toggle(v) { const st = D.settings; if (v === 'kat') st.katGebyr.on = !st.katGebyr.on; if (v === 'anke') st.anke.on = !st.anke.on; if (v === 'frikob') st.frikob.on = !st.frikob.on; S.last = `Toggled ${v}`; },
  toast(v) { toast(v); },
  copy() { try { navigator.clipboard.writeText(MOBILEPAY.replace(/ /g, '')).catch(() => {}); } catch (e) { } toast('Nummer kopieret'); },
  paid() { S.sheets = []; toast('En Admin får besked og registrerer indbetalingen'); },
  logout() { S.auth = 'email'; S.sheets = []; resetNav(); S.code = ''; },
  spin() {
    const o = S.sheets[S.sheets.length - 1], e = D.ledger.find(x => x.id === o.id);
    o.amount = 1 + Math.floor(Math.random() * e.amount * 2); o.deg = 360 * 6 + Math.floor(Math.random() * 360); o.phase = 'spin';
    e.status = 'anket'; add({ kind: 'gebyr', to: ME, reason: 'Anke-gebyr', amount: o.amount }); S.last = `Anke filed, gebyr ${o.amount} kr`;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => { const w = document.getElementById('wheel'); if (w) w.style.transform = `rotate(${o.deg}deg)`; }, 40);
    setTimeout(() => { o.phase = 'done'; render(); }, reduce ? 100 : 2700);
  },
  vpick(v) { S.sheets[S.sheets.length - 1].pick = v; },
  vsave() {
    const o = S.sheets[S.sheets.length - 1], e = D.ledger.find(x => x.id === o.id);
    if (o.pick === 'frifundet') { const loser = e.from; e.from = e.to; e.to = loser; }
    e.status = o.pick; S.sheets = [];
    toast(o.pick === 'frifundet' ? `Anken vandt. Bøden er flyttet til ${firstL(e.to)}` : 'Bøden står ved magt');
  },
  katsave(v) {
    const f = S.form, name = f.kname.trim(), price = +f.kprice, e = (f.kemo || '').trim() || '🏷️';
    S.sheets.pop();
    if (v) { Object.assign(kat(v), { name, price, e, desc: f.kdesc }); S.sheets = []; toast('Bødekategori gemt'); return; }
    const id = 'k' + (++seq); D.kats.push({ id, e, name, price, uses: 0, by: ME, desc: f.kdesc });
    if (D.settings.katGebyr.on) add({ kind: 'gebyr', to: ME, reason: `Ny bødekategori: ${e} ${name}`, amount: D.settings.katGebyr.amount });
    const g = S.give;
    if (g) { if (S.giveV === 3) g.cols.push(id); else if (g.cur) (S.giveV === 1 && g.same ? g.people : [g.cur]).forEach(p => bump(p, id, 1)); }
    toast(`${e} ${name} oprettet${D.settings.katGebyr.on ? ` · gebyr ${kr(D.settings.katGebyr.amount)}` : ''}`);
  },
  archive(v) { kat(v).archived = true; S.sheets = []; toast(`${kat(v).name} arkiveret`); },
  pm(v) { S.form.pm = v; S.form.pamt = String(Math.max(0, saldo(v))); },
  paysave() { const f = S.form; add({ kind: 'indbetaling', to: f.pm, amount: +f.pamt, by: ME }); S.sheets = []; toast(`Indbetaling på ${kr(+f.pamt)} fra ${firstL(f.pm)} registreret`); },
  haevsave() { const f = S.form; add({ kind: 'haev', by: ME, amount: +f.hamt, note: f.hnote.trim() }); S.sheets = []; toast(`${kr(+f.hamt)} hævet`); },
  memsave() { const f = S.form, id = 'm' + (++seq); D.members.push({ id, name: f.mname.trim(), unclaimed: true, email: f.mmail.trim() }); S.sheets = []; toast(`${f.mname.trim()} tilføjet`); },
  konkplace(v) { const o = S.form.order = S.form.order || []; const i = o.indexOf(v); i >= 0 ? o.splice(i, 1) : o.push(v); },
  konksave() {
    const f = S.form, g = 'g' + (++seq), fee = (i) => D.settings.konk[Math.min(i, D.settings.konk.length - 1)];
    D.konk.unshift({ id: 'c' + seq, title: f.title.trim(), date: f.date || '11. okt', group: g });
    D.members.forEach(m => { const i = f.order.indexOf(m.id); add({ kind: 'gebyr', to: m.id, reason: i >= 0 ? `${f.title.trim()}: ${i + 1}. plads` : `${f.title.trim()}: fraværende`, amount: i >= 0 ? fee(i) : D.settings.absent, group: g }); });
    S.stack.pop(); toast(`${f.title.trim()} gemt · ${D.members.length} gebyrer`);
  },
};
function sheetForm(t, id) {
  if (t === 'newkat') { const k = id ? kat(id) : null; return k ? { kemo: k.e, kname: k.name, kprice: String(k.price), kdesc: k.desc || '' } : {}; }
  if (t === 'pay') return id ? { pm: id, pamt: String(Math.max(0, saldo(id))) } : {};
  if (['haev', 'addmember'].includes(t)) return {};
  return S.form;
}

// ---------------- jumps (notes panel) ----------------
const JUMPS = [
  ['home', 'Hjem'], ['give', 'Giv bøder (tom)'], ['evening', 'Eksempel: en hel aften'], ['single', 'Én bøde til Jonas'], ['betal', 'Betal'],
  ['me', 'Min profil'], ['kats', 'Bødekategorier'], ['kasse', 'Kassen'], ['more', 'Mere'], ['admin', 'Indstillinger'],
  ['anke', 'Anke (hjulet)'], ['install', 'Åbnet i Safari'], ['email', 'Log ind'],
];
function jump(v) {
  S.sheets = []; S.give = null; S.toast = null;
  if (['install', 'email', 'code', 'boxes'].includes(v)) { S.auth = v; return; }
  S.auth = 'in'; resetNav();
  if (v === 'give') startGive(null);
  else if (v === 'single') startGive('m2');
  else if (v === 'evening') {
    // Mads' example: Jonas 2× For sent + 1× Hygge; Emil 1× For sent + 1× Spildt drikke.
    startGive(null); const g = S.give;
    g.people = ['m2', 'm5']; g.cur = 'm2'; g.cols = ['k1', 'k13', 'k12'];
    bump('m2', 'k1', 2); bump('m2', 'k13', 1); bump('m5', 'k1', 1); bump('m5', 'k12', 1);
    if (S.giveV === 2) g.receipt = true;
  }
  else if (v === 'betal') S.sheets = [{ t: 'betal' }];
  else if (v === 'me') push({ s: 'member', id: ME });
  else if (['kats', 'more', 'feed'].includes(v)) S.stack = [{ s: v }];
  else if (['kasse', 'admin'].includes(v)) S.stack = [{ s: 'more' }, { s: v }];
  else if (v === 'anke') { let e = live().find(x => x.kind === 'bode' && x.to === ME && !x.status && x.ago < 7 * 1440); if (!e) e = D.ledger.find(x => x.id === add({ kind: 'bode', from: 'm3', to: ME, kat: 'k4', amount: 10 })); openSheet({ t: 'bode', id: e.id }); }
}

// ---------------- notes + switcher ----------------
function renderNotes() {
  const H = HOMES[S.home], G = GIVES[S.giveV], t = totals();
  return `<div><span class="eyebrow">Prototype round 2 · Core screens and navigation</span><h1>Hjem ${S.home} · ${H.name} &nbsp;/&nbsp; Giv bøder ${S.giveV} · ${G.name}</h1></div>
    <p style="color:var(--fg)">Round 1 picked <b>A (tab bar)</b>. This round tries <b>three home screens</b> and <b>three ways to give many Bøder at once</b> (different Bøder and counts per person) that stay fast for one. Switch each one independently with the bar below. Arrow keys switch the home screen, and Shift + arrow keys switch the Giv bøder flow.</p>
    <div class="box"><dl><dt>Hjem ${S.home}</dt><dd>${H.d}</dd><dt>Giv bøder ${S.giveV}</dt><dd>${G.d}</dd><dt>One Bøde</dt><dd>${G.fast}</dd>
      <dt>Tab bar</dt><dd>Hjem · Aktivitet · <b>+</b> · Kategorier · Mere. Medlemmer and Kassen moved off the tab bar because the home screen now covers them. Kassen, Anker, Konkurrencer and Indstillinger are under Mere. Open Anker are no longer on the home screen.</dd>
      <dt>Wording</dt><dd>"Saldo" in GLOSSARY.md means what a Medlem still owes (Bøder + Gebyrer − Indbetalinger). The screens call it <b>"Mangler"</b> / <b>"Skylder"</b>.</dd></dl></div>
    <div class="box"><span class="eyebrow">Jump to</span><div class="jump">${JUMPS.map(([k, l]) => `<button data-a="jump" data-v="${k}">${l}</button>`).join('')}</div>
      <span class="eyebrow">View as</span><div class="jump">${['admin', 'medlem'].map(r => `<button aria-pressed="${S.role === r}" data-a="role" data-v="${r}">${r === 'admin' ? 'Admin' : 'Medlem'}</button>`).join('')}<button data-a="reset">Reset data</button></div></div>
    <div class="box"><span class="eyebrow">Live state</span><div class="state"><div><b>${kr(t.inbox)}</b>I bødekassen</div><div><b>${kr(saldo(ME))}</b>Mads mangler</div><div><b>${kr(t.unpaid)}</b>Alle mangler</div><div><b>${live().filter(e => e.kind === 'bode').length}</b>Bøder</div><div><b>${S.give ? giveSum().n : 0}</b>In the Giv flow</div></div>
      <div class="last">Last: ${esc(S.last)} · screen: ${S.auth === 'in' ? cur().s + (S.sheets.length ? ' + sheet ' + S.sheets.map(s => s.t).join('/') : '') : 'auth/' + S.auth}</div></div>`;
}
function renderSwitch() {
  return `<span class="grp"><button data-a="cyc" data-v="h-1" aria-label="Forrige hjem">‹</button><span class="lbl">Hjem ${S.home} · ${HOMES[S.home].name}</span><button data-a="cyc" data-v="h1" aria-label="Næste hjem">›</button></span>
    <span class="grp"><button data-a="cyc" data-v="g-1" aria-label="Forrige giv">‹</button><span class="lbl">Giv ${S.giveV} · ${GIVES[S.giveV].name}</span><button data-a="cyc" data-v="g1" aria-label="Næste giv">›</button></span>`;
}
function setHash() { try { history.replaceState(null, '', `#h${S.home}g${S.giveV}`); } catch (e) { } }
ACT.cyc = (v) => {
  const d = +v.slice(1), wrap = (x) => ((x - 1 + d + 3) % 3) + 1;
  if (v[0] === 'h') { S.home = wrap(S.home); resetNav(); } else { S.giveV = wrap(S.giveV); const open = !!S.give; S.sheets = []; S.give = null; if (open) startGive(null); }
  setHash();
};

// ---------------- render ----------------
function renderApp() {
  if (S.auth !== 'in') return authScreen() + toastHtml();
  return shell() + sheetHtml() + toastHtml();
}
let lastKey = '';
function render() {
  const f = document.activeElement, fid = f && f.id, sel = f && f.selectionStart;
  const scr = document.querySelector('.ph .scr'), sin = [...document.querySelectorAll('.ph .sheet .in')].pop();
  const key = S.home + JSON.stringify(cur()) + S.auth, skey = S.sheets.map(s => s.t + s.id).join() + S.giveV;
  const st = scr ? scr.scrollTop : 0, sst = sin ? sin.scrollTop : 0;
  const mx = document.querySelector('.ph .mx'), mxs = mx ? mx.scrollLeft : 0;
  $('#ph').innerHTML = renderApp();
  $('#notes').innerHTML = renderNotes();
  $('#sw').innerHTML = renderSwitch();
  if (window.lucide) lucide.createIcons();
  const scr2 = document.querySelector('.ph .scr'); if (scr2 && key === lastKey) scr2.scrollTop = st;
  const sin2 = [...document.querySelectorAll('.ph .sheet .in')].pop(); if (sin2 && skey === render.sk) sin2.scrollTop = sst;
  const mx2 = document.querySelector('.ph .mx'); if (mx2) mx2.scrollLeft = mxs;
  lastKey = key; render.sk = skey;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) { } } }
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a; if (!ACT[a]) return;
  ACT[a](el.dataset.v ?? '', el); render();
});
document.addEventListener('input', (ev) => {
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  const parts = k.split('.'); let o = S; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = ev.target.value;
  if (k === 'code') { S.code = ev.target.value.replace(/\D/g, '').slice(0, 6); if (S.code.length === 6) { S.auth = 'boxes'; S.last = 'Logged in with code'; } }
  render();
});
document.addEventListener('keydown', (ev) => {
  const t = ev.target; if (t.closest && t.closest('input, textarea, [contenteditable]')) return;
  const p = ev.shiftKey ? 'g' : 'h';
  if (ev.key === 'ArrowLeft') { ACT.cyc(p + '-1'); render(); } if (ev.key === 'ArrowRight') { ACT.cyc(p + '1'); render(); }
});
function readHash() { const m = /^h([1-3])g([1-3])$/.exec(location.hash.slice(1)); if (m) { S.home = +m[1]; S.giveV = +m[2]; } }
window.addEventListener('hashchange', () => { readHash(); resetNav(); render(); });
readHash();
render();
</script>
