<meta charset="utf-8">
<title>Bødekasse Design System</title>
<!--
  PROTOTYPE, throwaway. Answers "Design system" (Mads-Ringsted/Boedekasse#12):
  three radically different looks for Bødekasse, switchable via #A / #B / #C and the floating bar.
  Each look renders the same sample components (amount display, list row, primary button,
  tab bar, bottom sheet) in light and dark, with its token set listed underneath.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0&display=block">
<style>
/* Layout: page chrome is a quiet neutral lab bench; the two phones are the subject, tokens listed below them. */
:root {
  --bg: #F3F4F6; --fg: #15171C; --muted: #5E6370; --line: #D9DCE2; --card: #FFFFFF;
  --sw-bg: #15171C; --sw-fg: #F3F4F6;
  --chrome-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1013; --fg: #E8EAEE; --muted: #9AA0AC; --line: #2A2E36; --card: #171A1F; --sw-bg: #F3F4F6; --sw-fg: #15171C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E1013; --fg: #E8EAEE; --muted: #9AA0AC; --line: #2A2E36; --card: #171A1F; --sw-bg: #F3F4F6; --sw-fg: #15171C; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--chrome-font); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: flex; flex-direction: column; gap: 28px; }
.intro { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.intro h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.intro p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; line-height: 1.45; font-size: 14px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); gap: 2px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--fg); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:focus-visible, .sw button:focus-visible { outline: 2px solid #4D7CFE; outline-offset: 2px; }

.stage { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
.shot { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(375px, 100%); }
.phone { position: relative; width: 100%; height: 780px; border-radius: 44px; overflow: hidden; border: 10px solid #0A0A0B; box-shadow: 0 20px 50px rgba(0,0,0,.18); background: var(--p-bg); color: var(--p-text); font-family: var(--p-font); }
@media (max-width: 440px) { .phone { border-width: 6px; border-radius: 36px; height: 740px; } }

.tokens { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.tokens h2 { margin: 0 0 4px; font-size: 18px; grid-column: 1 / -1; }
.tokens .pitch { grid-column: 1 / -1; margin: 0; color: var(--muted); line-height: 1.5; max-width: 75ch; }
.tk { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sw-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; flex-direction: column; gap: 4px; width: 74px; }
.chip i { display: block; height: 40px; border-radius: 8px; border: 1px solid var(--line); }
.chip span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
.chip b { font-size: 11px; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.kv dd { margin: 0; min-width: 0; }
.typesample { display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; overflow: hidden; }
.typesample div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.typesample small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 8px; font-weight: 400; letter-spacing: 0; }
.ask { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }

/* Floating variant switcher (prototype chrome, not part of the design) */
.sw { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 4px; background: var(--sw-bg); color: var(--sw-fg); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-family: var(--mono); font-size: 13px; }
.sw button { font: inherit; background: transparent; color: inherit; border: 0; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.sw button:hover { background: color-mix(in srgb, var(--sw-fg) 15%, transparent); }
.sw .lbl { padding: 0 10px; white-space: nowrap; min-width: 128px; text-align: center; }

/* ---------- shared phone bits ---------- */
.phone svg { display: block; flex: none; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 14px; font-weight: 600; font-family: -apple-system, system-ui, sans-serif; }
.status .dots { display: flex; gap: 4px; align-items: center; }
.status .dots i { width: 16px; height: 9px; border-radius: 2px; background: currentColor; opacity: .85; }
.body { flex: 1; overflow: hidden; min-height: 0; }
.num { font-variant-numeric: tabular-nums; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: "FILL" 1, "wght" 500; display: inline-block; }

/* ---------- A: Kasse ---------- */
.v-A .body { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 22px; }
.a-head { display: flex; justify-content: space-between; align-items: center; }
.a-box { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; }
.a-iconbtn { width: 36px; height: 36px; border-radius: 50%; background: var(--p-surface); display: grid; place-items: center; color: var(--p-text); }
.a-hero { background: var(--p-main); color: var(--p-on-main); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.a-hero .lab { font-size: 14px; opacity: .85; }
.a-hero .amt { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.a-hero .sub { font-size: 13px; opacity: .85; }
.a-hero .btns { display: flex; gap: 8px; margin-top: 14px; }
.a-pill { border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; }
.a-pill.white { background: #fff; color: #1A2A8F; }
.a-pill.ghost { background: rgba(255,255,255,.18); color: #fff; }
.a-stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--p-surface); border-radius: 14px; padding: 12px 4px; }
.a-stats div { display: flex; flex-direction: column; gap: 2px; align-items: center; font-size: 12px; color: var(--p-muted); }
.a-stats b { color: var(--p-text); font-size: 15px; font-weight: 600; }
.a-sec { display: flex; flex-direction: column; gap: 8px; }
.a-sec h3 { margin: 0; font-size: 20px; font-weight: 600; }
.a-group { background: var(--p-surface); border-radius: 14px; overflow: hidden; }
.a-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.a-row + .a-row { border-top: 1px solid var(--p-line); }
.a-av { width: 38px; height: 38px; border-radius: 50%; background: var(--p-main-soft); color: var(--p-main-ink); display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; }
.a-row .t { flex: 1; min-width: 0; }
.a-row .t div { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-row .t small { display: block; font-size: 13px; color: var(--p-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-row .amt { font-size: 15px; font-weight: 600; }
.pos { color: var(--p-pos); }
.a-tab { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 8px 6px 26px; background: var(--p-surface); border-top: 1px solid var(--p-line); }
.a-tab div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--p-muted); }
.a-tab div.on { color: var(--p-main-ink); }
.a-fab { width: 56px; height: 56px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 16px color-mix(in srgb, var(--p-main) 45%, transparent); }
.a-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 80%; background: var(--p-bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; }
.a-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--p-line); margin: 8px auto 4px; }
.a-sheet .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; }
.a-sheet .hd h3 { margin: 0; font-size: 20px; font-weight: 600; }
.a-sheet .in { flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
.a-label { font-size: 13px; color: var(--p-muted); font-weight: 500; }
.a-people { display: flex; gap: 12px; overflow: hidden; padding: 6px 0 0 6px; }
.a-person { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; position: relative; }
.a-person .a-av { width: 52px; height: 52px; font-size: 18px; }
.a-person.sel .a-av { box-shadow: 0 0 0 2.5px var(--p-bg), 0 0 0 4.5px var(--p-main); }
.a-check { position: absolute; top: 34px; right: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; border: 2px solid var(--p-bg); }
.a-radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--p-line); display: grid; place-items: center; flex: none; }
.a-radio.on { background: var(--p-main); border-color: var(--p-main); color: var(--p-on-main); }
.a-new { color: var(--p-main-ink); }
.a-cta { margin: 10px 16px 30px; background: var(--p-main); color: var(--p-on-main); border-radius: 999px; padding: 16px; text-align: center; font-size: 17px; font-weight: 600; }

/* ---------- B: Konsol ---------- */
.v-B .body { padding: 2px 16px 0; display: flex; flex-direction: column; gap: 16px; }
.b-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 2px; }
.b-box { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--p-line); border-radius: 6px; padding: 5px 8px 5px 6px; background: var(--p-surface); }
.b-logo { width: 20px; height: 20px; border-radius: 4px; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--p-mono); }
.b-me { width: 30px; height: 30px; border-radius: 6px; background: var(--p-surface-2); border: 1px solid var(--p-line); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.v-B h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.b-stats { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--p-line); border-radius: 6px; background: var(--p-surface); overflow: hidden; }
.b-stats > div { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.b-stats > div:nth-child(odd) { border-right: 1px solid var(--p-line); }
.b-stats > div:nth-child(-n+2) { border-bottom: 1px solid var(--p-line); }
.b-stats span { font-size: 12px; color: var(--p-muted); }
.b-stats b { font-family: var(--p-mono); font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
.b-stats .hl b { color: var(--p-main-ink); font-size: 28px; }
.b-btns { display: flex; gap: 8px; }
.b-btn { flex: 1; text-align: center; border-radius: 6px; padding: 9px 12px; font-size: 14px; font-weight: 500; border: 1px solid var(--p-line); background: var(--p-surface); }
.b-btn.pri { background: var(--p-main); color: var(--p-on-main); border-color: color-mix(in srgb, var(--p-main) 70%, #000); }
.b-sechd { display: flex; justify-content: space-between; align-items: baseline; }
.b-sechd h3 { margin: 0; font-size: 14px; font-weight: 600; }
.b-sechd a { font-size: 13px; color: var(--p-muted); }
.b-list { border-top: 1px solid var(--p-line); }
.b-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--p-line); font-size: 14px; }
.b-row .t { min-width: 0; }
.b-row .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-row .t small { display: block; color: var(--p-muted); font-size: 12px; margin-top: 1px; }
.b-tag { font-family: var(--p-mono); font-size: 10px; letter-spacing: .04em; border: 1px solid var(--p-line); border-radius: 4px; padding: 2px 5px; color: var(--p-muted); width: 58px; text-align: center; }
.b-tag.in { color: var(--p-main-ink); border-color: color-mix(in srgb, var(--p-main) 50%, transparent); }
.b-row .amt { font-family: var(--p-mono); font-size: 13px; }
.b-tab { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 0 26px; border-top: 1px solid var(--p-line); background: var(--p-bg); }
.b-tab div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--p-muted); }
.b-tab div.on { color: var(--p-text); }
.b-tab div.on svg { color: var(--p-main-ink); }
.b-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; background: var(--p-surface); border-top: 1px solid var(--p-line); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; }
.b-sheet .hd { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--p-line); }
.b-sheet .hd h3 { margin: 0; font-size: 16px; font-weight: 600; }
.b-sheet .in { flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.b-lab { font-size: 13px; font-weight: 500; }
.b-input { border: 1px solid var(--p-line); border-radius: 6px; padding: 8px 10px; font-size: 14px; color: var(--p-muted); background: var(--p-bg); }
.b-opts { border: 1px solid var(--p-line); border-radius: 6px; overflow: hidden; }
.b-opt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; font-size: 14px; }
.b-opt + .b-opt { border-top: 1px solid var(--p-line); }
.b-opt small { font-family: var(--p-mono); color: var(--p-muted); font-size: 12px; }
.b-cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--p-muted) 70%, transparent); display: grid; place-items: center; }
.b-cb.on { background: var(--p-main); border-color: var(--p-main); color: var(--p-on-main); }
.b-foot { border-top: 1px solid var(--p-line); padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 10px; }
.b-sum { display: flex; justify-content: space-between; font-family: var(--p-mono); font-size: 12.5px; color: var(--p-muted); }
.b-sum b { color: var(--p-text); font-weight: 500; }

/* ---------- C: Hippo ---------- */
.v-C .body { padding: 2px 18px 0; display: flex; flex-direction: column; gap: 18px; }
.c-head { display: flex; justify-content: space-between; align-items: center; }
.c-head h2 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.01em; }
.c-box { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--p-ink); border-radius: 999px; padding: 4px 8px 4px 12px; font-size: 13px; font-weight: 800; background: var(--p-surface); }
.c-card { border: 2px solid var(--p-ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--p-ink); background: var(--p-surface); }
.c-hero { background: var(--p-main); color: var(--p-on-main); padding: 18px 20px; display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.c-hero .lab { font-size: 15px; font-weight: 800; opacity: .9; }
.c-hero .amt { font-size: 48px; font-weight: 900; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
.c-btn { border: 2px solid var(--p-ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--p-ink); padding: 10px 16px; font-weight: 900; font-size: 15px; background: var(--p-surface); color: var(--p-text); white-space: nowrap; }
.c-sec { display: flex; flex-direction: column; gap: 10px; }
.c-sec h3 { margin: 0; font-size: 19px; font-weight: 900; }
.c-board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.c-mem { padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 18px; box-shadow: 2px 2px 0 var(--p-ink); }
.c-mem .t { min-width: 0; }
.c-mem .t div { font-weight: 800; font-size: 14px; }
.c-mem .t small { font-weight: 800; font-size: 13px; color: var(--p-muted); }
.c-mem.top { background: var(--p-surface-2); }
.c-av { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--p-ink); display: grid; place-items: center; font-weight: 900; font-size: 16px; color: #2A1416; flex: none; position: relative; }
.c-crown { position: absolute; top: -12px; right: -8px; font-size: 18px; color: #F5B800; }
.c-feed { display: flex; flex-direction: column; gap: 8px; }
.c-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--p-surface); border: 2px solid var(--p-ink); }
.c-item .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
.c-item .t small { display: block; color: var(--p-muted); font-weight: 600; font-size: 12.5px; margin-top: 2px; }
.c-amt { font-weight: 900; font-size: 15px; white-space: nowrap; }
.c-tabwrap { position: absolute; left: 18px; right: 18px; bottom: 22px; }
.c-tab { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 8px; border-radius: 26px; border: 2px solid var(--p-ink); background: var(--p-surface); box-shadow: 3px 3px 0 var(--p-ink); }
.c-tab span { justify-self: center; font-size: 26px; color: var(--p-muted); }
.c-tab span.on { color: var(--p-main); }
.c-tab .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); display: grid; place-items: center; border: 2px solid var(--p-ink); font-size: 30px; }
.v-C .body { padding-bottom: 100px; }
.c-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 82%; background: var(--p-bg); border-radius: 28px 28px 0 0; border-top: 2px solid var(--p-ink); display: flex; flex-direction: column; }
.c-sheet .hd { padding: 18px 20px 8px; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.c-sheet .hd h3 { margin: 0; font-size: 24px; font-weight: 900; line-height: 1.15; }
.c-x { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--p-ink); display: grid; place-items: center; background: var(--p-surface); font-size: 20px; flex: none; }
.c-sheet .in { flex: 1; overflow: hidden; padding: 6px 20px; display: flex; flex-direction: column; gap: 16px; }
.c-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
.c-pick div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; position: relative; }
.c-pick .c-av { width: 56px; height: 56px; font-size: 20px; }
.c-pick .sel .c-av { box-shadow: 0 0 0 3px var(--p-bg), 0 0 0 6px var(--p-main); }
.c-tick { position: absolute; top: 38px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--p-main); color: var(--p-on-main); border: 2px solid var(--p-ink); display: grid; place-items: center; font-size: 15px; }
.c-q { font-size: 15px; font-weight: 900; }
.c-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.c-chip { border: 2px solid var(--p-ink); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 800; background: var(--p-surface); }

</style>

const V = { A, B, C };

let cur = 'A';
let mode = null;

function hostDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}

function applyTokens(el, v) {
  const t = v.tokens[mode];
  for (const [k, val] of Object.entries(t)) el.style.setProperty('--p-' + k, val);
  if (!t.ink) el.style.setProperty('--p-ink', t.line);
  el.style.setProperty('--p-font', v.fonts.font);
  el.style.setProperty('--p-mono', v.fonts.mono);
  el.style.colorScheme = mode;
}

function renderTokens(v) {
  const sw = (name, hex) => `<div class="chip"><i style="background:${hex}"></i><b>${name}</b><span>${hex}</span></div>`;
  const t = v.tokens[mode];
  const typeRows = v.type.map(([n, s, w, txt, mono]) => `<div style="font-family:${mono ? v.fonts.mono : v.fonts.font};font-size:${Math.min(s, 40)}px;font-weight:${w};color:var(--fg)">${txt}<small>${n} ${s}/${w}</small></div>`).join('');
  document.getElementById('tokens').innerHTML = `
    <h2>${cur} · ${v.name}</h2>
    <p class="pitch">${v.pitch}</p>
    <div class="tk"><span class="eyebrow">Main colour (${mode === 'dark' ? 'mørk' : 'lys'})</span><div class="sw-row">${sw('main', t.main)}${sw('on-main', t['on-main'])}${sw('main-ink', t['main-ink'])}${sw('main-soft', t['main-soft'])}</div>
      <span class="eyebrow">Semantic</span><div class="sw-row">${sw('pos', t.pos)}${sw('neg', t.neg)}</div></div>
    <div class="tk"><span class="eyebrow">Neutrals (${mode === 'dark' ? 'mørk' : 'lys'})</span><div class="sw-row">${sw('bg', t.bg)}${sw('surface', t.surface)}${sw('surface-2', t['surface-2'])}${sw('line', t.line)}${sw('muted', t.muted)}${sw('text', t.text)}</div></div>
    <div class="tk"><span class="eyebrow">Type scale</span><div class="typesample">${typeRows}</div></div>
    <div class="tk"><span class="eyebrow">Choices</span><dl class="kv">
      <dt>font</dt><dd>${v.font}</dd><dt>icons</dt><dd>${v.icons}</dd><dt>components</dt><dd>${v.lib}</dd>
      <dt>radius</dt><dd>${v.radius}</dd><dt>spacing</dt><dd>4-pt scale: 4 · 8 · 12 · 16 · 24 · 32</dd><dt>depth</dt><dd>${v.extra}</dd></dl></div>
    <div class="ask">To decide: which main colour, which font, which icon set, and which component approach. Mixing is fine, e.g. "B's structure with A's blue".</div>`;
}

  for (const [id, fn] of [['p1', 'home'], ['p2', 'sheet']]) {
    const el = document.getElementById(id);
    el.className = 'phone v-' + cur;
    applyTokens(el, v);
    el.innerHTML = `<div class="scr">${v[fn]()}</div>`;
  }
  renderTokens(v);
  document.getElementById('lbl').textContent = `${cur} · ${v.name}`;
  document.getElementById('m-light').setAttribute('aria-pressed', mode === 'light');
  document.getElementById('m-dark').setAttribute('aria-pressed', mode === 'dark');
}

function go(d) {
  cur = KEYS[(KEYS.indexOf(cur) + d + KEYS.length) % KEYS.length];
  try { history.replaceState(null, '', '#' + cur); } catch (e) { location.hash = cur; }
  render();
}

const h = (location.hash || '').slice(1).toUpperCase();
if (KEYS.includes(h)) cur = h;
mode = hostDark() ? 'dark' : 'light';
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; render(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
addEventListener('hashchange', () => { const k = location.hash.slice(1).toUpperCase(); if (KEYS.includes(k) && k !== cur) { cur = k; render(); } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
render();
</script>
